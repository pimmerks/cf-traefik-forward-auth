version: 2
updates:
  # Go modules in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
